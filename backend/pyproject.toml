[project]
name = "evidentia"
version = "0.1.0"
description = "EvidentIA — copiloto de entorno y verificación trazable (hackIAthon Panamá, reto TVN Media)"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Config & data modeling
    "pydantic-settings>=2.3.0",
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.1.0",

    # Background jobs
    "dramatiq[redis]>=1.18.0",
    "redis>=5.0.0",

    # LangChain ecosystem (retrieval helpers)
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-qdrant>=0.2.0",

    # Local embeddings (ONNX, CPU-friendly, no API key)
    "fastembed>=0.4.0",

    # Vector DB
    "qdrant-client>=1.11.0",

    # NLP / parsing (lazy imports; models downloaded in Docker build)
    "spacy>=3.7.0",
    "docling>=2.15.0",

    # Graph (in-memory over relational store)
    "networkx>=3.2.0",

    # Ingestion helpers
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
override-dependencies = ["opencv-python-headless"]
